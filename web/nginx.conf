# InferScale frontend: HTTPS, login and rate limit, then /api/ to the api container.
# The secrets (certificate, key, password hashes) are mounted read-only from the VM.

limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;
limit_req_status 429;
server_tokens off;

# Docker's DNS: the api container's address is looked up again if it changes
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/secrets/tls.crt;
    ssl_certificate_key /etc/nginx/secrets/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # every page and API call needs a login (accounts: owner, demo, client)
    auth_basic           "InferScale";
    auth_basic_user_file /etc/nginx/secrets/htpasswd;

    # 50 requests per second per address, bursts up to 100, then 429
    limit_req            zone=perip burst=100 nodelay;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    set $api http://api:8000;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # metrics: only the accounts in metrics.htpasswd (owner, prometheus)
    location ^~ /api/metrics {
        auth_basic_user_file /etc/nginx/secrets/metrics.htpasswd;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        # the signed-in account; it replaces any X-User header the client sends
        proxy_set_header X-User $remote_user;
        proxy_read_timeout 60s;
    }
}

# health check for Docker only: plain HTTP on localhost inside the container, never published
server {
    listen 127.0.0.1:8081;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
