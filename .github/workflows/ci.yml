# CI for InferScale: tests, security scans and the Docker images on every push and pull request.
# Every action is pinned to a commit (the tag is in the comment), so a changed tag cannot change this workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read   # the workflow only reads the repository

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and dependency audit (Python 3.15.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install the project and the test tools
        run: pip install -e ".[test]" "pip-audit==2.10.1"
      - name: Unit tests (fake model and fake database)
        run: pytest -q tests/
      - name: Known vulnerabilities in the Python dependencies (pip-audit)
        run: pip-audit --skip-editable

  secrets:
    name: Secret scan of the whole history (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # every commit, so a secret that was removed later is still found
      - name: gitleaks (reviewed false positives are listed in .gitleaksignore)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --no-banner --verbose

  docker:
    name: Dockerfiles, images and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Lint web/Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: web/Dockerfile
          failure-threshold: warning
      - name: Build the api image
        run: docker build -t inferscale-api:ci .
      - name: Build the web image
        run: docker build -t inferscale-web:ci web
      - name: Scan the api image (Trivy; fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: inferscale-api:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the web image (Trivy; fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: inferscale-web:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the database image (Trivy; report only)
        # postgres:16.16-alpine is the newest official image; its findings (Alpine's libxml2 and the
        # gosu helper used only at start-up) can only be fixed upstream, so they are reported, not failed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: postgres:16.16-alpine
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
