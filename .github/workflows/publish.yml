# Builds the MkDocs website from docs/ and publishes it to GitHub Pages on every push to main.
# Actions are pinned to commits (the tag is in the comment), like in ci.yml.
name: publish-docs
on:
  push:
    branches:
      - main

permissions:
  contents: write   # mkdocs gh-deploy pushes the built site to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install MkDocs
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.8.2"
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
        env:
          NO_MKDOCS_2_WARNING: "1"
