# InferScale on one VM: web (nginx, HTTPS, login) -> api (FastAPI + model) -> db (PostgreSQL)
# Start with `make up`. The database password is in db.env and the web secrets are in secrets/;
# both are made on the VM or copied to it, and never committed to Git.
name: inferscale

services:
  db:
    image: postgres:16.16-alpine
    restart: unless-stopped
    env_file: db.env                  # POSTGRES_PASSWORD=...
    environment:
      POSTGRES_USER: inferscale
      POSTGRES_DB: inferscale
    volumes:
      - pgdata:/var/lib/postgresql/data   # the history survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferscale -d inferscale"]
      interval: 5s
      timeout: 3s
      retries: 10
    # no ports: only the api container reaches the database, on the internal network

  api:
    build: .
    image: inferscale-api:${VERSION:-dev}
    restart: unless-stopped
    env_file: db.env                  # the api needs only the database password
    depends_on:
      db:
        condition: service_healthy    # start only when the database answers
    # no ports: only the web container reaches the api, on the internal network

  web:
    build: ./web
    image: inferscale-web:${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy    # start only when the model is loaded
    ports:
      - "443:8443"                    # HTTPS, the only public port
    volumes:
      - ./secrets:/etc/nginx/secrets:ro   # certificate, key and password hashes; not in the image, not in Git

volumes:
  pgdata:
