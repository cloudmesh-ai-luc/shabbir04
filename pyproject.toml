[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inferscale"
dynamic = ["version"]
description = "InferScale: one ML inference service on three clouds with cmx vm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "prometheus-fastapi-instrumentator>=6.1",
    "transformers>=4.40",
]

[project.scripts]
inferscale = "inferscale.main:cli"

[project.optional-dependencies]
model = ["torch"]  # the real model; the tests use a fake one, so they do not need PyTorch
test = [
    "pytest>=7.0",
    "httpx>=0.25",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = "VERSION"}
